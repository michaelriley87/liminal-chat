name: liminal-chat

services:
  backend:
    build:
      context: ./backend
    environment:
      LIMINAL_ALLOWED_ORIGINS: "${PUBLIC_ORIGIN:-http://localhost:8080}"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
